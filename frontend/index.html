<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulant</title>
<style>
  :root { --bg:#0e1117; --card:#171b24; --line:#2a3040; --txt:#e6e9ef; --dim:#8b93a7; --acc:#6c8cff;
          --crit:#ff4d6d; --high:#ff8c42; --med:#f2c14e; --low:#6ec1e4; --ok:#4cd39a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:14px/1.45 system-ui,Segoe UI,Arial,sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:baseline; }
  header h1 { margin:0; font-size:20px; } header span { color:var(--dim); }
  main { padding:16px 20px; max-width:1500px; margin:auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; }
  form.card { display:grid; gap:10px; margin-bottom:16px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  input[type=text], select { background:#0e1117; color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:8px; min-width:260px; flex:1; }
  button { background:var(--acc); color:#fff; border:0; padding:9px 16px; border-radius:6px; cursor:pointer; font-size:14px; }
  button.sec { background:#2a3040; } button:disabled { opacity:.5; cursor:default; }
  label.chk { display:flex; gap:6px; align-items:center; background:#0e1117; border:1px solid var(--line); padding:6px 10px; border-radius:6px; }
  .pill { font-size:11px; padding:1px 7px; border-radius:10px; color:#000; font-weight:600; text-transform:uppercase; }
  .critical{background:var(--crit)} .high{background:var(--high)} .medium{background:var(--med)} .low{background:var(--low)}
  .tag { font-size:11px; color:var(--dim); border:1px solid var(--line); border-radius:4px; padding:0 5px; margin-left:4px; }
  #cols { display:grid; grid-template-columns:repeat(auto-fit,minmax(360px,1fr)); gap:12px; margin-bottom:16px; }
  .pcol h3 { margin:0 0 2px; font-size:15px; } .goal { color:var(--dim); font-size:12px; margin-bottom:8px; min-height:30px; }
  .pcol img { width:100%; max-height:300px; object-fit:contain; background:#000; border-radius:6px; border:1px solid var(--line); }
  .bar { height:8px; background:#0e1117; border-radius:4px; overflow:hidden; margin:8px 0; border:1px solid var(--line); }
  .bar div { height:100%; width:0; background:linear-gradient(90deg,var(--ok),var(--med),var(--crit)); transition:width .3s; }
  .feed { height:230px; overflow:auto; font-size:12px; background:#0e1117; border:1px solid var(--line); border-radius:6px; padding:6px; }
  .feed div { margin-bottom:4px; } .th { color:#cdd6f4; } .ac { color:var(--acc); } .rs { color:var(--dim); } .fd { color:var(--high); }
  .badge { float:right; font-size:11px; padding:2px 8px; border-radius:10px; background:#2a3040; }
  .badge.success{background:var(--ok);color:#000} .badge.abandoned,.badge.error,.badge.failure{background:var(--crit);color:#000} .badge.running{background:var(--acc)}
  .scores { display:flex; gap:10px; flex-wrap:wrap; margin:10px 0; }
  .score { background:#0e1117; border:1px solid var(--line); border-radius:8px; padding:8px 14px; text-align:center; min-width:110px; }
  .score b { font-size:24px; display:block; } .score small { color:var(--dim); text-transform:capitalize; }
  .finding { border-top:1px solid var(--line); padding:10px 0; display:grid; grid-template-columns:1fr 150px; gap:12px; }
  .finding img { width:150px; border-radius:4px; border:1px solid var(--line); }
  .finding .t { font-weight:600; } .finding .d { color:var(--dim); font-size:12px; margin-top:3px; } .finding .q { color:#b9c3e6; font-style:italic; font-size:12px; margin-top:3px; }
  .finding .fx { color:var(--ok); font-size:12px; margin-top:3px; }
  .tl { font-size:12px; color:var(--dim); } .tl div { padding:1px 0; }
  .hidden { display:none; } #status { color:var(--dim); margin-left:8px; }
  details { margin:6px 0; } summary { cursor:pointer; color:var(--acc); }
</style>
</head>
<body>
<header><h1>Simulant</h1><span>simulated beta users for your website</span></header>
<main>
  <form class="card" id="form">
    <div class="row">
      <input type="text" id="url" placeholder="https://your-staging-site.com" value="http://127.0.0.1:8001" required>
      <input type="text" id="goal" placeholder="Optional: what should users try? (e.g. buy a phone case using a coupon)">
    </div>
    <div class="row" id="personas"></div>
    <div class="row">
      <label class="chk"><input type="checkbox" id="auth"> I own this site or am authorised to test it (required for the Integrity Engine)</label>
      <button type="submit" id="go">Run simulation</button><span id="status"></span>
      <span style="flex:1"></span>
      <select id="past" style="flex:0;min-width:240px"><option value="">Past runs…</option></select>
      <button type="button" class="sec" id="replay">Replay</button>
    </div>
  </form>
  <div id="cols"></div>
  <div class="card hidden" id="report"></div>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let RUN = null, ws = null;

async function init() {
  const ps = await (await fetch('/api/personas')).json();
  $('#personas').innerHTML = ps.map(p => `<label class="chk" title="${esc(p.description)}"><input type="checkbox" value="${p.id}" checked> ${esc(p.name)} <span class="tag">${p.engine}</span></label>`).join('');
  loadPast();
}
async function loadPast() {
  const rs = await (await fetch('/api/runs')).json();
  $('#past').innerHTML = '<option value="">Past runs…</option>' + rs.map(r => `<option value="${r.run_id}">${r.run_id}${r.done ? ` · score ${r.score} · ${r.findings} findings · ${esc(r.url)}` : ' (unfinished)'}</option>`).join('');
}
$('#form').addEventListener('submit', async e => {
  e.preventDefault();
  const personas = [...document.querySelectorAll('#personas input:checked')].map(i => i.value);
  const res = await fetch('/api/runs', { method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ url: $('#url').value.trim(), goal: $('#goal').value, personas, authorized: $('#auth').checked }) });
  const j = await res.json();
  if (!res.ok) { $('#status').textContent = '⚠ ' + (j.detail || 'error'); $('#status').style.color = 'var(--crit)'; return; }
  $('#status').style.color = '';
  watch(j.run_id);
});
$('#replay').onclick = () => { const id = $('#past').value; if (id) watch(id); };

function watch(runId) {
  RUN = runId; if (ws) ws.close();
  $('#cols').innerHTML = ''; $('#report').classList.add('hidden'); $('#report').innerHTML = '';
  $('#go').disabled = true; $('#status').textContent = 'running… ' + runId;
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/' + runId);
  ws.onmessage = m => handle(JSON.parse(m.data));
  ws.onclose = () => { $('#go').disabled = false; loadPast(); };
}

const counts = {};
function col(id) { return document.getElementById('p-' + id); }
function feed(id, cls, html) { const f = col(id)?.querySelector('.feed'); if (!f) return; f.insertAdjacentHTML('beforeend', `<div class="${cls}">${html}</div>`); f.scrollTop = f.scrollHeight; }

function handle(ev) {
  const id = ev.persona;
  switch (ev.type) {
    case 'run_start':
      ev.personas.forEach(p => { counts[p.id] = 0; $('#cols').insertAdjacentHTML('beforeend',
        `<div class="card pcol" id="p-${p.id}"><span class="badge running">starting</span><h3>${esc(p.name)} <span class="tag">${p.engine}</span></h3>
         <div class="goal">planning…</div><img alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="><div class="bar"><div></div></div><div class="feed"></div></div>`); });
      break;
    case 'persona_start': col(id).querySelector('.goal').textContent = 'Goal: ' + ev.goal; col(id).querySelector('.badge').textContent = 'running'; break;
    case 'screen': col(id).querySelector('img').src = `/runs-files/${RUN}/${ev.shot}`; break;
    case 'thought':
      feed(id, 'th', `<b>#${ev.step}</b> 💭 ${esc(ev.thought)}`); feed(id, 'ac', `→ ${esc(ev.action)}`);
      col(id).querySelector('.bar div').style.width = ev.frustration + '%'; break;
    case 'action': feed(id, 'rs', esc(ev.result) + (ev.rage_clicks ? ` (⚡ ${ev.rage_clicks} rage-clicks)` : '')); col(id).querySelector('.bar div').style.width = ev.frustration + '%'; break;
    case 'finding': feed(id, 'fd', `<span class="pill ${ev.finding.severity}">${ev.finding.severity}</span> ${esc(ev.finding.title)}`); break;
    case 'persona_end': { const b = col(id).querySelector('.badge'); b.className = 'badge ' + ev.status; b.textContent = ev.status; feed(id, 'rs', 'END: ' + esc(ev.reason)); break; }
    case 'log': if (id && col(id)) feed(id, 'rs', 'ℹ ' + esc(ev.msg)); break;
    case 'report': renderReport(ev.report); break;
    case 'error': $('#status').textContent = '⚠ Run failed: ' + ev.message; $('#status').style.color = 'var(--crit)'; break;
    case 'run_end': if (ev.status !== 'error') { $('#status').textContent = 'finished: ' + ev.status; $('#status').style.color = ''; } break;
  }
}

function src(f) { return f.source === 'sensor' ? 'measured' : f.source === 'oracle' ? 'rule check' : 'AI-observed'; }
function renderReport(r) {
  const sc = r.score;
  const tiles = `<div class="score"><b style="color:${sc.overall >= 80 ? 'var(--ok)' : sc.overall >= 60 ? 'var(--med)' : 'var(--crit)'}">${sc.overall}</b><small>overall</small></div>` +
    Object.entries(sc.vitals).map(([k, v]) => `<div class="score"><b>${v}</b><small>${k}</small></div>`).join('');
  const journeys = r.journeys.map(j => `<details><summary>${esc(j.persona)} — ${esc(j.status)} after ${j.steps} steps (frustration ${j.frustration}/100)</summary>
      <div class="tl"><div><i>Goal: ${esc(j.goal)}</i></div>${j.timeline.map(t => `<div>#${t.step} ${esc(t.desc)} → ${esc(t.result)} <span class="tag">F ${t.frustration}</span></div>`).join('')}
      ${j.reason ? `<div><b>Ended:</b> ${esc(j.reason)}</div>` : ''}</div></details>`).join('');
  const findings = r.findings.map(f => `<div class="finding"><div>
      <span class="pill ${f.severity}">${f.severity}</span> <span class="tag">${f.vital}</span><span class="tag">${src(f)}</span><span class="tag">${f.personas.join(', ')}</span>
      <div class="t">${f.id} · ${esc(f.title)}</div>${f.detail ? `<div class="d">${esc(f.detail)}</div>` : ''}
      ${f.persona_quote ? `<div class="q">“${esc(f.persona_quote)}”</div>` : ''}${f.suggested_fix ? `<div class="fx">Fix: ${esc(f.suggested_fix)}</div>` : ''}</div>
      <div>${f.screenshot ? `<a href="/runs-files/${r.run_id}/${f.screenshot}" target="_blank"><img src="/runs-files/${r.run_id}/${f.screenshot}"></a>` : ''}</div></div>`).join('');
  $('#report').innerHTML = `<h2 style="margin:0 0 6px">Report <span class="tag">${r.elapsed_s}s</span> <span class="tag">${esc(r.release_advice)}</span></h2>
    <div class="scores">${tiles}</div><p>${esc(r.summary)}</p>
    ${r.top_risks?.length ? '<b>Top risks</b><ul>' + r.top_risks.map(t => `<li>${esc(t)}</li>`).join('') + '</ul>' : ''}
    <h3>Journeys</h3>${journeys}<h3>Findings (${r.findings.length})</h3>${findings}`;
  $('#report').classList.remove('hidden'); $('#report').scrollIntoView({ behavior: 'smooth' });
}
init();
</script>
</body>
</html>
